name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2026.7.1)'
        required: true
        type: string

run-name: Release v${{ inputs.version }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION (expected YYYY.M.D)"
            exit 1
          fi
          echo "✓ Version format valid: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install dev requirements
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev gcc

      - name: Run golangci-lint
        run: |
          make lint

  build-linux:
    needs: [validate-version, lint]
    strategy:
      matrix:
        arch: [amd64, arm64, i386]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
          - arch: i386
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Linux (${{ matrix.arch }}) binary
        run: |
          make linux-${{ matrix.arch }} VERSION="${{ needs.validate-version.outputs.version }}"

      - name: Upload Linux (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/
          retention-days: 7
          if-no-files-found: error

  build-windows:
    runs-on: ubuntu-24.04
    needs: [validate-version, lint]
    strategy:
      matrix:
        arch: [amd64, i686]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Windows (${{ matrix.arch }}) binary
        run: |
          make windows-${{ matrix.arch }} VERSION="${{ needs.validate-version.outputs.version }}"

      - name: Upload Windows (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/
          retention-days: 7
          if-no-files-found: error

  build-macos-dmg:
    needs: [validate-version, lint]
    strategy:
      matrix:
        include:
          - arch: arm64
            runs-on: macos-15
          - arch: amd64
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Cache GTK-OSX toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/gtk
            ~/.new_local
            ~/Source
            ~/.cargo
            ~/.rustup
          key: >-
            macos-dmg-${{ matrix.arch }}-${{ hashFiles('build/macos/versions.env',
            'build/macos/prepare.sh') }}

      - name: Install cargo-c (librsvg build requirement)
        run: cargo install cargo-c --features=vendored-openssl

      - name: Prepare GTK-OSX
        run: bash build/macos/prepare.sh --arch ${{ matrix.arch }}

      - name: Build DMG (${{ matrix.arch }})
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash build/macos/build.sh --arch ${{ matrix.arch }}

      - name: Upload macOS DMG (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-macos-${{ matrix.arch }}
          path: .pkg-build/package/*.dmg
          retention-days: 7
          if-no-files-found: error

  build-packages:
    needs: [validate-version, build-linux]
    strategy:
      matrix:
        include:
          - arch: amd64
            rpm_arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            rpm_arch: arm64
            runs-on: ubuntu-24.04-arm
          - arch: i386
            rpm_arch: i686
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

      - name: Build Linux packages (DEB, RPM) for ${{ matrix.arch }}
        run: |
          make deb-${{ matrix.arch }} rpm-${{ matrix.rpm_arch }} VERSION="${{ needs.validate-version.outputs.version }}"

      - name: Upload Linux packages (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-linux-packages-${{ matrix.arch }}
          path: |
            .pkg-build/package/*.deb
            .pkg-build/package/*.rpm
          retention-days: 7
          if-no-files-found: error

  build-appimage:
    needs: [validate-version, build-linux]
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Linux (${{ matrix.arch }}) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

      - name: Build AppImage (${{ matrix.arch }})
        run: |
          make appimage-${{ matrix.arch }} VERSION="${{ needs.validate-version.outputs.version }}"

      - name: Upload AppImage (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-linux-appimage-${{ matrix.arch }}
          path: .pkg-build/package/*.AppImage
          retention-days: 7
          if-no-files-found: error

  build-innosetup:
    runs-on: ubuntu-24.04
    needs: [validate-version, build-windows]
    strategy:
      matrix:
        arch: [amd64, i686]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Windows (${{ matrix.arch }}) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}

      - name: Build Inno Setup installer (${{ matrix.arch }})
        run: |
          make innosetup-${{ matrix.arch }} VERSION="${{ needs.validate-version.outputs.version }}"

      - name: Upload Inno Setup installer (${{ matrix.arch }}) artifact
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-innosetup-${{ matrix.arch }}
          path: .pkg-build/package/*.exe
          retention-days: 7
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: [validate-version, build-windows, build-packages, build-appimage, build-innosetup, build-macos-dmg]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release directory
        run: mkdir -p release/linux release/windows release/macos

      - name: Download Windows amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-windows-amd64
          path: release/windows/amd64

      - name: Download Windows i686 artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-windows-i686
          path: release/windows/i686

      - name: Download Linux packages (amd64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-packages-amd64
          path: release/linux/amd64

      - name: Download Linux packages (arm64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-packages-arm64
          path: release/linux/arm64

      - name: Download Linux packages (i386) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-packages-i386
          path: release/linux/i386

      - name: Download AppImage (amd64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-appimage-amd64
          path: release/linux

      - name: Download AppImage (arm64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-linux-appimage-arm64
          path: release/linux

      - name: Download Inno Setup installer (amd64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-innosetup-amd64
          path: release/windows

      - name: Download Inno Setup installer (i686) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-innosetup-i686
          path: release/windows

      - name: Download macOS DMG (arm64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-macos-arm64
          path: release/macos

      - name: Download macOS DMG (amd64) artifact
        uses: actions/download-artifact@v8
        with:
          name: hashverifier-macos-amd64
          path: release/macos

      - name: Prepare Windows amd64 archive
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          (cd release/windows && zip -r hashverifier-${VERSION}-windows-amd64.zip amd64)

      - name: Prepare Windows i686 archive
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          (cd release/windows && zip -r hashverifier-${VERSION}-windows-i686.zip i686)

      - name: Remove Windows directories
        run: rm -rf release/windows/amd64 release/windows/i686

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          name: Release v${{ needs.validate-version.outputs.version }}
          generate_release_notes: true
          files: |
            release/windows/*.exe
            release/windows/*.zip
            release/macos/*.dmg
            release/linux/amd64/*.deb
            release/linux/amd64/*.rpm
            release/linux/arm64/*.deb
            release/linux/arm64/*.rpm
            release/linux/i386/*.deb
            release/linux/i386/*.rpm
            release/linux/*.AppImage
