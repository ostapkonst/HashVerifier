name: macOS MVP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.0.0)'
        required: true
        default: 'v0.0.0'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must match vX.Y.Z, got: ${VERSION}" >&2
            exit 1
          fi

      - name: Cache GTK-OSX toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/gtk
            ~/.new_local
            ~/Source
            ~/.cargo
            ~/.rustup
          key: >-
            macos-mvp-arm64-${{ hashFiles('build/macos/versions.env',
            'build/macos/prepare.sh') }}

      - name: Install cargo-c (librsvg build requirement)
        run: cargo install cargo-c --features=vendored-openssl

      - name: Prepare GTK-OSX
        run: bash build/macos/prepare.sh

      - name: Build DMG
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash build/macos/build.sh --arch arm64

      - name: Verify bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          DMG=".pkg-build/package/"
          DMG+="hashverifier-${VERSION#v}-macos-arm64.dmg"
          bash build/macos/verify.sh \
            --app .pkg-build/macos/arm64/stage/HashVerifier.app \
            --dmg "${DMG}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-macos-arm64-mvp
          path: .pkg-build/package/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p .pkg-build/macos/arm64
          bash build/macos/diagnose.sh \
            .pkg-build/macos/arm64/stage/HashVerifier.app \
            > .pkg-build/macos/arm64/diagnose.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hashverifier-macos-arm64-diagnostics
          path: .pkg-build/macos/arm64/diagnose.txt
          retention-days: 7
          if-no-files-found: ignore
