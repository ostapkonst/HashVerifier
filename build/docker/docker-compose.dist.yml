services:
  linux-amd64:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.dist
      target: linux-builder
      platforms:
        - linux/amd64
      args:
        - VERSION=${VERSION:-0.0.0}
    volumes:
      - ../../dist/linux-amd64:/dist

  linux-arm64:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.dist
      target: linux-arm64-builder
      platforms:
        - linux/arm64
      args:
        - VERSION=${VERSION:-0.0.0}
    volumes:
      - ../../dist/linux-arm64:/dist

  linux-i386:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.dist
      target: linux-i386-builder
      platforms:
        - linux/amd64
      args:
        - VERSION=${VERSION:-0.0.0}
    volumes:
      - ../../dist/linux-i386:/dist

  windows-amd64:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.dist
      target: windows-dist
      platforms:
        - linux/amd64
      args:
        - VERSION=${VERSION:-0.0.0}
    volumes:
      - ../../dist/windows-amd64:/dist

  windows-i686:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile.dist
      target: windows-dist-i686
      platforms:
        - linux/amd64
      args:
        - VERSION=${VERSION:-0.0.0}
    volumes:
      - ../../dist/windows-i686:/dist
