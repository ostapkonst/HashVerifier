services:
  appimage-builder:
    build:
      context: ../..
      dockerfile: build/linux/Dockerfile.appimage
      target: appimage-builder
      platforms:
        - linux/amd64
    volumes:
      - ../../dist:/app/dist
      - ../../build:/app/build
      - ../../.pkg-build:/app/.pkg-build
      - ../../LICENSE:/app/LICENSE
      - ../../THIRD_PARTY_NOTICES:/app/THIRD_PARTY_NOTICES
      - ./linuxdeploy-plugin-gtk.sh:/usr/local/bin/linuxdeploy-plugin-gtk.sh
    environment:
      - VERSION

  appimage-builder-arm64:
    build:
      context: ../..
      dockerfile: build/linux/Dockerfile.appimage
      target: appimage-builder-arm64
      platforms:
        - linux/arm64
    volumes:
      - ../../dist:/app/dist
      - ../../build:/app/build
      - ../../.pkg-build:/app/.pkg-build
      - ../../LICENSE:/app/LICENSE
      - ../../THIRD_PARTY_NOTICES:/app/THIRD_PARTY_NOTICES
      - ./linuxdeploy-plugin-gtk.sh:/usr/local/bin/linuxdeploy-plugin-gtk.sh
    environment:
      - VERSION
      - PACKAGE_ARCH=aarch64
