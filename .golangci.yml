version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - zerologlint
    - nilnil
    - nilerr
    - godot
    - gocritic
    - gomoddirectives
    - noctx
    - wsl_v5
    - gomodguard_v2
    - unconvert

formatters:
  enable:
    - goimports
    - gofmt
  settings:
    goimports:
      local-prefixes:
        - github.com/ostapkonst/HashVerifier
